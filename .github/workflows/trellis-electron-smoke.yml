name: Trellis Electron Smoke

on:
  pull_request:
    paths:
      - "electron/trellis/**"
      - "electron/forkRuntime.ts"
      - "src/api/trellisClient.ts"
      - "src/components/trellis/**"
      - "src/types/trellis*.ts"
      - "src/main.tsx"
      - "src/styles/trellis.css"
      - "scripts/smoke-trellis-electron.mjs"
      - ".github/workflows/trellis-electron-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Electron UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build

      - name: Run Electron UI smoke
        run: xvfb-run -a node scripts/smoke-trellis-electron.mjs

      - name: Capture smoke diagnostic
        id: diagnose
        if: always()
        shell: bash
        run: |
          reason="$(node -e 'const fs=require("fs"); try { const r=JSON.parse(fs.readFileSync("test-results/trellis-electron-smoke.json","utf8")); const m=String(r?.error?.message ?? r?.error ?? "ok"); process.stdout.write(Buffer.from(m.slice(0,120),"utf8").toString("base64url")); } catch { process.stdout.write("report-unavailable"); }')"
          printf 'reason=%s\n' "${reason:-ok}" >> "$GITHUB_OUTPUT"
          cat test-results/trellis-electron-smoke.json || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trellis-electron-smoke-${{ steps.diagnose.outputs.reason || 'ok' }}
          path: |
            test-results/trellis-electron-smoke.png
            test-results/trellis-electron-smoke.json
          if-no-files-found: warn
